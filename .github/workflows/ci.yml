name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.1"
  GOEXPERIMENT: nosizespecializedmalloc
  CGO_ENABLED: "0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: set up go (actions/setup-go v7.0.0)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: formatting
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: unit tests
        run: go test ./...
      - name: build
        run: go build -trimpath -o "agent-mail$(go env GOEXE)" .
      - name: behaviour tests
        run: bash tests/agent-mail.test.sh
