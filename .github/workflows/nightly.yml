name: nightly

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: how long to fuzz each target
        default: 55m

permissions:
  contents: read

env:
  GO_VERSION: "1.27.1"
  GOEXPERIMENT: nosizespecializedmalloc
  CGO_ENABLED: "0"

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      fuzz: ${{ steps.list.outputs.fuzz }}
    steps:
      - name: checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: set up go (actions/setup-go v7.0.0)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: list fuzz targets
        id: list
        run: echo "fuzz=$(go test -list '^Fuzz' . | grep '^Fuzz' | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  fuzz:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.fuzz) }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: set up go (actions/setup-go v7.0.0)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: locate the generated corpus
        id: corpus
        run: echo "dir=$(go env GOCACHE)/fuzz/github.com/nidduzzi/agent-mail/${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - name: restore the corpus from earlier nights (actions/cache v6.1.0)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: fuzz
        env:
          FUZZTIME: ${{ inputs.fuzztime || '55m' }}
          TARGET: ${{ matrix.target }}
        run: bash tests/fuzz.sh "$TARGET"
      - name: keep failing inputs (actions/upload-artifact v7.0.1)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: failing-${{ matrix.target }}
          path: testdata/fuzz/
          if-no-files-found: ignore
