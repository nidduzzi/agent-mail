name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GO_VERSION: "1.27.1"
  TARGETS: "linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: checkout (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: set up go (actions/setup-go v7.0.0)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: behaviour tests
        run: |
          go vet ./...
          go build -trimpath -o agent-mail .
          bash tests/agent-mail.test.sh
      - name: build release binaries
        run: |
          mkdir dist
          for target in $TARGETS; do
            os="${target%/*}"
            arch="${target#*/}"
            suffix=""
            if [ "$os" = windows ]; then suffix=".exe"; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -buildid= -X main.version=$GITHUB_REF_NAME" \
              -o "dist/agent-mail_${GITHUB_REF_NAME}_${os}_${arch}${suffix}" .
          done
          (cd dist && sha256sum agent-mail_* > SHA256SUMS)
      - name: attest build provenance (actions/attest-build-provenance v4.2.2)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/agent-mail_*
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Verify a download with: sha256sum -c SHA256SUMS --ignore-missing, then gh attestation verify <file> --repo $GITHUB_REPOSITORY"
